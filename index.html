<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node(1) - IoT Gateway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        body { background: #000; color: #00FF66; font-family: 'Space Mono', monospace; padding: 20px; }
        pre { background: #111; padding: 15px; border: 1px solid #333; border-radius: 5px; overflow-x: auto; }
        h1 { font-size: 20px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Node(1) // IoT Gateway Active</h1>
    <p>Última telemetría recibida del nodo móvil:</p>
    <pre id="data-view">Esperando datos de campo...</pre>

    <script>
        // Verificamos si la app nos está mandando datos por URL (Query Params)
        const params = new URLSearchParams(window.location.search);
        
        if (params.has('node_id') || params.has('ruido')) {
            const telemetry = {
                timestamp: params.get('timestamp') || new Date().toISOString(),
                node_id: params.get('node_id') || 'N/A',
                ruido_db: params.get('ruido') || 0,
                luz: params.get('luz') || 0,
                emi_ut: params.get('emi') || 0,
                lat: params.get('lat') || 0,
                lon: params.get('lon') || 0,
                pitch: params.get('pitch') || 0,
                roll: params.get('roll') || 0,
                alineado: params.get('alineado') || 'NO'
            };

            // Guardamos localmente en el navegador de la página para persistencia temporal
            localStorage.setItem('latest_node_data', JSON.stringify(telemetry));
            document.getElementById('data-view').innerText = JSON.stringify(telemetry, null, 2);
        } else {
            // Si solo entran a consultar, mostramos lo último guardado
            const savedData = localStorage.getItem('latest_node_data');
            if (savedData) {
                document.getElementById('data-view').innerText = JSON.stringify(JSON.parse(savedData), null, 2);
            } else {
                document.getElementById('data-view').innerText = "{ status: 'Gateway en línea, sin paquetes registrados aún' }";
            }
        }
    </script>
</body>
</html>
